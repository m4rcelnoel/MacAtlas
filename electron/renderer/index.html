<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>MacAtlas</title>
<style>
:root {
  color-scheme: light dark;
  --accent: #007aff;
  --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
  --content: #ffffff;
  --group: #f5f5f7;
  --group-border: rgba(0,0,0,.07);
  --sep: rgba(0,0,0,.08);
  --label: rgba(0,0,0,.88);
  --secondary: rgba(0,0,0,.52);
  --tertiary: rgba(0,0,0,.32);
  --fill: rgba(0,0,0,.05);
  --fill-2: rgba(0,0,0,.08);
  --sidebar-sel: rgba(0,0,0,.09);
  --toolbar: rgba(255,255,255,.82);
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 24px rgba(0,0,0,.08);
  --sidebar-w: 236px;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --content: #1e1e1e;
    --group: #2a2a2c;
    --group-border: rgba(255,255,255,.06);
    --sep: rgba(255,255,255,.08);
    --label: rgba(255,255,255,.9);
    --secondary: rgba(255,255,255,.55);
    --tertiary: rgba(255,255,255,.3);
    --fill: rgba(255,255,255,.06);
    --fill-2: rgba(255,255,255,.1);
    --sidebar-sel: rgba(255,255,255,.1);
    --toolbar: rgba(30,30,30,.82);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 30px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; }
body {
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  color: var(--label);
  -webkit-font-smoothing: antialiased;
  user-select: none; cursor: default; overflow: hidden;
}
body.browser { background: var(--content); }
body.browser .sidebar { background: color-mix(in srgb, var(--group) 85%, transparent); }
button { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; }

/* ── Sidebar ─────────────────────────────────────────── */
.sidebar { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--sep); }
.sb-drag { height: 52px; flex: 0 0 auto; -webkit-app-region: drag; }
.sb-search { margin: 0 10px 8px; position: relative; }
.sb-search svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--secondary); }
.sb-search input {
  width: 100%; height: 28px; border-radius: 7px; border: 0; outline: 0;
  background: var(--fill-2); color: var(--label); padding: 0 26px 0 27px; font: inherit;
  user-select: text;
}
.sb-search input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.sb-search input::placeholder { color: var(--secondary); }
.sb-search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border-radius: 50%; border: 0; background: var(--tertiary); color: var(--content); display: none; place-items: center; padding: 0; font-size: 10px; line-height: 1; }
.sb-search.has-q .clear { display: grid; }
nav { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
.nav-sec { display: flex; align-items: center; width: 100%; border: 0; background: none; font: inherit; font-size: 11px; font-weight: 600; color: var(--secondary); padding: 14px 8px 4px; text-align: left; cursor: default; border-radius: 5px; }
.nav-sec .chev { width: 11px; height: 11px; margin-left: auto; stroke-width: 2.4; transform: rotate(90deg); transition: transform .15s ease; opacity: 0; }
.nav-sec:hover .chev, .nav-sec:focus-visible .chev, .nav-sec.shut .chev { opacity: 1; }
.nav-sec.shut .chev { transform: none; }
.nav-item {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px;
  border: 0; background: transparent; border-radius: 7px; text-align: left;
}
.nav-item:hover { background: var(--fill); }
.nav-item.sel { background: var(--accent); color: #fff; }
body.inactive .nav-item.sel { background: var(--sidebar-sel); color: var(--label); }
.nav-item .tile { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; color: #fff; flex: 0 0 auto; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12); }
.nav-item .tile svg { width: 12px; height: 12px; stroke-width: 2; }
.nav-item .lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item .cnt { font-size: 11.5px; color: var(--secondary); font-variant-numeric: tabular-nums; }
.nav-item.sel .cnt { color: rgba(255,255,255,.8); }
body.inactive .nav-item.sel .cnt { color: var(--secondary); }
.sb-bottom { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--sep); padding: 0 10px 0 0; }
.sb-foot { flex: 1; min-width: 0; padding: 10px 8px 14px 18px; font-size: 11px; color: var(--secondary); }
.sb-gear { width: 28px; height: 28px; flex: 0 0 auto; border: 0; border-radius: 7px; background: transparent; color: var(--secondary); display: grid; place-items: center; padding: 0; }
.sb-gear:hover { background: var(--fill); color: var(--label); }
.sb-gear.sel { background: var(--accent); color: #fff; }
.sb-gear svg { width: 17px; height: 17px; }

/* history charts: one series each, accent hue, recessive grid */
.chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 14px 0 6px; }
.chart-card .ch { font-weight: 600; font-size: 12.5px; color: var(--secondary); }
.chart { position: relative; height: 120px; margin-top: 2px; }
.chart svg { width: 100%; height: 100%; overflow: visible; display: block; }
.ch-grid { stroke: var(--sep); stroke-width: 1; vector-effect: non-scaling-stroke; }
.ch-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.ch-dot { fill: var(--accent); stroke: var(--group); stroke-width: 2; vector-effect: non-scaling-stroke; }
.ch-cross { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.ch-axis { font-size: 9px; fill: var(--secondary); }
.ch-tip { position: absolute; transform: translate(-50%, -100%); background: var(--content); border: 1px solid var(--group-border); box-shadow: var(--shadow); border-radius: 7px; padding: 4px 8px; font-size: 11px; color: var(--label); white-space: nowrap; pointer-events: none; text-align: center; }
.ch-tip b { font-size: 12.5px; font-variant-numeric: tabular-nums; }

/* my macs, migration, licenses */
.mac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 10px; }
.mac-top { display: flex; align-items: center; gap: 10px; }
.mac-top img { width: 52px; height: 52px; object-fit: contain; }
.mac-top .tile { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #fff; }
.mac-top b { font-size: 14px; }
.mac-card .kv { min-height: 30px; padding: 5px 12px; font-size: 12px; }
.mig-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.mig-step.done { opacity: .7; }
.mig-num { width: 20px; height: 20px; border-radius: 50%; background: var(--fill-2); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--secondary); flex: 0 0 auto; }
.mig-step.done .mig-num { background: #34c759; color: #fff; }
.mig-step .ch .pill { margin-left: auto; }
.lic-row { display: flex; gap: 6px; flex-wrap: wrap; }
.lic-row input { height: 26px; border-radius: 6px; border: 1px solid var(--group-border); background: var(--group); color: var(--label); padding: 0 8px; font: 13px -apple-system, sans-serif; outline: 0; user-select: text; }
.lic-row input[type=number] { width: 90px; }
.lic-row input:focus, .lic-row select:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }

/* selection checkboxes */
.pick { width: 18px; flex: 0 0 auto; display: grid; place-items: center; cursor: default; }
.pick input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
.pick-none { visibility: hidden; }
.tilecard .tile-pick { position: absolute; top: 8px; left: 8px; }
.pick-all { margin-left: auto; display: inline-flex; gap: 2px; }
.pick-all button { border: 0; background: transparent; color: var(--accent); font-size: 12px; font-weight: 500; padding: 2px 6px; border-radius: 5px; }
.pick-all button:hover { background: var(--fill); }
.group-title .pick-all { font-weight: 400; }
.pick-summary { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-top: 6px; }
.pick-summary .pick-all { margin-left: 0; }

/* sort & filter bar */
.list-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -4px 0 12px; }
.list-search { position: relative; flex: 0 1 220px; }
.list-search svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--secondary); }
.list-search input { width: 100%; height: 28px; border-radius: 7px; border: 1px solid var(--group-border); background: var(--group); color: var(--label); padding: 0 8px 0 27px; font: 13px -apple-system, sans-serif; outline: 0; user-select: text; }
.list-search input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; flex: 1 1 auto; }
.chip { height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--group-border); background: var(--group); font-size: 12px; color: var(--label); }
.chip span { color: var(--secondary); font-variant-numeric: tabular-nums; margin-left: 2px; }
.chip:hover { background: var(--fill-2); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.on span { color: rgba(255,255,255,.8); }
.list-tools .select { margin-left: auto; height: 28px; }

/* clickable rows + detail panel */
.row.clickable, .tilecard.clickable { cursor: default; }
.row.current { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.inspector { position: fixed; top: 52px; right: 0; bottom: 0; width: min(380px, 92vw); z-index: 40; background: var(--content); border-left: 1px solid var(--sep); box-shadow: -12px 0 30px rgba(0,0,0,.12); transform: translateX(105%); transition: transform .2s ease; overflow-y: auto; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 12px; }
.inspector.open { transform: none; }
.insp-head { display: flex; align-items: center; gap: 12px; }
.insp-head img, .insp-head .ricon { width: 52px; height: 52px; border-radius: 12px; flex: 0 0 auto; object-fit: contain; }
.insp-head .ricon svg { width: 24px; height: 24px; }
.insp-head > div { flex: 1; min-width: 0; }
.insp-head b { display: block; font-size: 16px; font-weight: 700; overflow-wrap: anywhere; user-select: text; }
.insp-head span { color: var(--secondary); font-size: 12px; }
.insp-close { align-self: flex-start; font-size: 13px; }
.insp-update { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 12%, transparent); }
.insp-update svg { width: 20px; height: 20px; color: var(--accent); flex: 0 0 auto; }
.insp-update b { display: block; font-size: 13px; }
.insp-update span { font-size: 12px; color: var(--secondary); }
.insp-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.insp-actions .btn { height: 28px; padding: 0 10px; font-size: 12px; }
.insp-cmd > span { display: block; font-size: 11px; font-weight: 600; color: var(--secondary); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .03em; }
.insp-cmd > div { display: flex; align-items: center; gap: 4px; background: var(--group); border: 1px solid var(--group-border); border-radius: 8px; padding: 4px 4px 4px 10px; }
.insp-cmd code { flex: 1; min-width: 0; font: 12px var(--mono); overflow-wrap: anywhere; user-select: text; }
.insp-note { background: var(--group); border: 1px solid var(--group-border); border-radius: 10px; padding: 10px 12px; }
.insp-note .pill:first-child { margin-left: 0; }
.insp-note p { margin: 6px 0 0; white-space: pre-wrap; font-size: 12.5px; user-select: text; }
.insp-facts .kv { min-height: 32px; padding: 6px 12px; font-size: 12.5px; }
.insp-facts .kv .v { overflow-wrap: anywhere; max-width: 62%; }
@media (max-width: 760px) { .inspector { top: 0; width: 100vw; } .list-tools .select { margin-left: 0; } }

/* about */
.about-head { display: flex; align-items: center; gap: 14px; padding: 14px; border-bottom: 1px solid var(--sep); }
.about-head img { width: 56px; height: 56px; }
.about-head b { font-size: 15px; display: block; }
.about-head span { display: block; color: var(--secondary); font-size: 12px; margin-top: 1px; }
.about-head a { color: var(--accent); text-decoration: none; }
.about-head a:hover { text-decoration: underline; }

/* settings controls (macOS System Settings look) */
.set-row { min-height: 52px; }
.set-row .ricon { width: 26px; height: 26px; border-radius: 7px; }
.set-row .ricon svg { width: 14px; height: 14px; }
.set-row:hover { background: transparent; }
.set-ctl { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; max-width: 55%; flex-wrap: wrap; justify-content: flex-end; }
.switch { position: relative; width: 38px; height: 22px; flex: 0 0 auto; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: default; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 11px; background: var(--fill-2); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12); transition: background .18s; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .18s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.switch.disabled { opacity: .4; }
.segmented.choice { margin: 0; }
.segmented.choice button { width: auto; padding: 0 12px; font-size: 12px; color: var(--label); }
.select { height: 26px; border-radius: 6px; border: 1px solid var(--group-border); background: var(--content); color: var(--label); font: 13px -apple-system, sans-serif; padding: 0 8px; outline: 0; }
.select:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.set-ctl .btn { height: 26px; padding: 0 12px; font-size: 12px; }
.btn:disabled { opacity: .4; pointer-events: none; }
@media (max-width: 760px) { .set-row { flex-wrap: wrap; } .set-ctl { max-width: 100%; margin-left: 44px; justify-content: flex-start; } }
.sb-foot b { color: var(--label); font-weight: 500; }

/* ── Main ────────────────────────────────────────────── */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--content); position: relative; }
.toolbar {
  height: 52px; flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 20px;
  -webkit-app-region: drag; border-bottom: 1px solid var(--sep);
  background: var(--toolbar); backdrop-filter: saturate(180%) blur(20px);
  position: sticky; top: 0; z-index: 5;
}
.toolbar > * { -webkit-app-region: no-drag; }
.toolbar .titles { -webkit-app-region: drag; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.toolbar h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toolbar .subtitle { font-size: 11px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toolbar .spacer { flex: 1; -webkit-app-region: drag; align-self: stretch; }
.tb-btn {
  height: 28px; min-width: 32px; padding: 0 7px; border: 0; border-radius: 6px; background: transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; color: var(--secondary);
}
.tb-btn:hover { background: var(--fill); color: var(--label); }
.tb-btn:active { background: var(--fill-2); }
.tb-btn:disabled { opacity: .35; pointer-events: none; }
.tb-btn svg { width: 17px; height: 17px; }
.segmented { display: inline-flex; background: var(--fill-2); border-radius: 7px; padding: 2px; gap: 2px; margin: 0 4px; }
.segmented button { height: 24px; width: 32px; border: 0; border-radius: 5px; background: transparent; display: grid; place-items: center; color: var(--secondary); }
.segmented button.on { background: var(--content); color: var(--label); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
@media (prefers-color-scheme: dark) { .segmented button.on { background: #636366; } }
.segmented svg { width: 15px; height: 15px; }
.snap-pill { display: none; align-items: center; gap: 6px; height: 24px; padding: 0 4px 0 10px; border-radius: 12px; background: color-mix(in srgb, #ff9f0a 18%, transparent); color: #c66b00; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
@media (prefers-color-scheme: dark) { .snap-pill { color: #ffb340; } }
.snap-pill.on { display: inline-flex; }
.snap-pill button { height: 18px; border: 0; border-radius: 9px; padding: 0 8px; background: rgba(0,0,0,.08); font-size: 11px; font-weight: 600; color: inherit; }
.only-narrow { display: none; }

.content { flex: 1; overflow-y: auto; overflow-x: hidden; }
.page { max-width: 1080px; margin: 0 auto; padding: 24px 28px 48px; }

/* ── Groups (System Settings style) ───────────────────── */
.group { background: var(--group); border: 1px solid var(--group-border); border-radius: 10px; overflow: hidden; }
.group + .group, .group-title + .group { margin-top: 0; }
.group-title { font-size: 13px; font-weight: 600; margin: 26px 2px 8px; display: flex; align-items: baseline; gap: 8px; }
.group-title .n { font-size: 12px; font-weight: 400; color: var(--secondary); }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 38px; padding: 8px 14px; }
.kv + .kv { border-top: 1px solid var(--sep); }
.kv .k { color: var(--label); }
.kv .v { color: var(--secondary); text-align: right; user-select: text; font-variant-numeric: tabular-nums; }

/* ── Overview ─────────────────────────────────────────── */
.hero { text-align: center; padding: 8px 0 22px; }
.hero img { width: 210px; height: 210px; object-fit: contain; margin: -20px 0 -26px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.12)); }
.hero .ph { width: 120px; height: 120px; margin: 0 auto 14px; border-radius: 28px; display: grid; place-items: center; background: var(--fill); color: var(--secondary); }
.hero .ph svg { width: 56px; height: 56px; stroke-width: 1.3; }
.hero h2 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
.hero .sub { color: var(--secondary); font-size: 13px; margin-top: 2px; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 12px; }
.card { background: var(--group); border: 1px solid var(--group-border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card .ch { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.card .ch .tile { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; }
.card .ch .tile svg { width: 13px; height: 13px; stroke-width: 2; }
.card .big { font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.card .muted { color: var(--secondary); font-size: 12px; }
.bar { height: 8px; border-radius: 4px; background: var(--fill-2); overflow: hidden; margin: 4px 0 2px; }
.bar > span { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.bar.warn > span { background: #ff9f0a; }
.bar.crit > span { background: #ff453a; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
.cat-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--group); border: 1px solid var(--group-border); text-align: left; transition: transform .12s, box-shadow .12s; }
.cat-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.cat-card .tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: 0 0 auto; }
.cat-card .tile svg { width: 16px; height: 16px; stroke-width: 2; }
.cat-card .t { min-width: 0; }
.cat-card .t div:first-child { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-card .t div:last-child { color: var(--secondary); font-size: 12px; font-variant-numeric: tabular-nums; }
.foot-note { color: var(--secondary); font-size: 11.5px; text-align: center; margin-top: 28px; }

/* ── Category list ────────────────────────────────────── */
.cat-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.cat-head .tile { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; color: #fff; flex: 0 0 auto; }
.cat-head .tile svg { width: 24px; height: 24px; stroke-width: 1.8; }
.cat-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.cat-head p { margin: 1px 0 0; color: var(--secondary); }
.row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 7px 10px 7px 12px; position: relative; }
.row + .row { border-top: 1px solid var(--sep); }
.row:hover { background: var(--fill); }
.row .ricon { width: 32px; height: 32px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 8px; }
.row .ricon img { width: 32px; height: 32px; object-fit: contain; }
.row .ricon.glyph { color: #fff; }
.row .ricon.glyph svg { width: 16px; height: 16px; stroke-width: 2; }
.row .rmain { flex: 1; min-width: 0; }
.row .rname { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; }
.row .rsub { color: var(--secondary); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; }
.row .rcmd { display: flex; align-items: center; gap: 6px; max-width: 44%; min-width: 0; }
.row .rcmd code { font: 11.5px var(--mono); color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; }
.badge { font-size: 10px; font-weight: 600; letter-spacing: .02em; padding: 2px 6px; border-radius: 5px; background: var(--fill-2); color: var(--secondary); flex: 0 0 auto; text-transform: lowercase; }
.badge.brew { background: color-mix(in srgb, #ff9f0a 18%, transparent); color: #c66b00; }
.badge.mas { background: color-mix(in srgb, #0a84ff 16%, transparent); color: #0a6fd8; }
.badge.npm { background: color-mix(in srgb, #ff453a 16%, transparent); color: #d63a30; }
.badge.pip3 { background: color-mix(in srgb, #30b0c7 18%, transparent); color: #1d8ea3; }
.badge.gem { background: color-mix(in srgb, #ff375f 16%, transparent); color: #d62d50; }
.badge.docker { background: color-mix(in srgb, #0db7ed 18%, transparent); color: #0a8fbc; }
.badge.code { background: color-mix(in srgb, #5e5ce6 16%, transparent); color: #4d4bcf; }
@media (prefers-color-scheme: dark) {
  .badge.brew { color: #ffb340; } .badge.mas { color: #5eb1ff; } .badge.npm { color: #ff7a72; }
  .badge.pip3 { color: #6bd3e5; } .badge.gem { color: #ff7591; } .badge.docker { color: #5fd3f7; } .badge.code { color: #9d9bff; }
}
.ractions { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
.row:hover .ractions, .tilecard:hover .ractions { opacity: 1; }
.act { width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; display: grid; place-items: center; color: var(--secondary); padding: 0; }
.act:hover { background: var(--fill-2); color: var(--accent); }
.act svg { width: 15px; height: 15px; }
.act.ok { color: #34c759; }

/* grid view */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 6px; }
.tilecard { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 14px 8px 10px; border-radius: 12px; position: relative; }
.tilecard:hover { background: var(--fill); }
.tilecard .ticon { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 15px; margin-bottom: 8px; }
.tilecard .ticon img { width: 64px; height: 64px; object-fit: contain; }
.tilecard .ticon.glyph { color: #fff; width: 52px; height: 52px; margin: 6px 0 14px; border-radius: 13px; }
.tilecard .ticon.glyph svg { width: 24px; height: 24px; stroke-width: 1.9; }
.tilecard .tname { font-weight: 500; font-size: 12.5px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; }
.tilecard .tver { color: var(--secondary); font-size: 11px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tilecard .ractions { position: absolute; top: 6px; right: 6px; background: var(--content); border-radius: 7px; box-shadow: var(--shadow); }

/* ── Empty / scanning ─────────────────────────────────── */
.center { min-height: calc(100vh - 52px); display: grid; place-items: center; padding: 32px; }
.empty { text-align: center; max-width: 440px; }
.intro { max-width: 500px; }
.intro-steps { list-style: none; margin: 0 0 22px; padding: 0; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.intro-steps li { display: flex; gap: 12px; align-items: flex-start; background: var(--group); border: 1px solid var(--group-border); border-radius: 10px; padding: 10px 12px; }
.intro-steps .tile { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: #fff; flex: 0 0 auto; }
.intro-steps .tile svg { width: 16px; height: 16px; stroke-width: 2; }
.intro-steps b { display: block; font-size: 13px; }
.intro-steps span:not(.tile) { color: var(--secondary); font-size: 12px; line-height: 1.4; }
.intro-warn { display: flex; gap: 10px; align-items: center; text-align: left; background: color-mix(in srgb, #ff9f0a 14%, transparent); border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; font-size: 12px; }
.intro-warn > svg { width: 20px; height: 20px; color: #ff9f0a; flex: 0 0 auto; }
.intro-warn b { display: block; font-size: 13px; }
.intro-warn .btn { margin-left: auto; flex: 0 0 auto; }
.empty .glyph { width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 24px; display: grid; place-items: center; color: #fff; background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 80%, white), var(--accent)); box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 35%, transparent); }
.empty .glyph svg { width: 48px; height: 48px; stroke-width: 1.5; }
.empty h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 8px; }
.empty p { color: var(--secondary); margin: 0 0 22px; line-height: 1.5; }
.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn { height: 32px; padding: 0 16px; border-radius: 8px; border: 0; font-weight: 500; background: var(--fill-2); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.btn svg { width: 15px; height: 15px; }
.progress { width: 280px; height: 6px; border-radius: 3px; background: var(--fill-2); overflow: hidden; margin: 18px auto 10px; }
.progress span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .35s ease; }
.scan-counts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 14px; min-height: 24px; }
.scan-counts span { font-size: 12px; color: var(--secondary); background: var(--fill); border-radius: 999px; padding: 3px 10px; }
.scan-counts b { color: var(--label); font-variant-numeric: tabular-nums; }
.step { color: var(--secondary); font-size: 12px; font-variant-numeric: tabular-nums; min-height: 18px; }
.spin.small { width: 18px; height: 18px; margin: 0; border-width: 2px; }
.spin { width: 28px; height: 28px; margin: 0 auto 16px; border-radius: 50%; border: 3px solid var(--fill-2); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.script-card { margin-top: 12px; }
.script-card details { margin-top: 6px; }
.script-card summary { cursor: default; color: var(--accent); font-size: 12px; width: max-content; }
.script-card pre { margin: 8px 0 0; padding: 12px 14px; max-height: 320px; overflow: auto; border-radius: 8px; background: var(--content); border: 1px solid var(--group-border); font: 11.5px/1.55 var(--mono); color: var(--label); user-select: text; white-space: pre; }
.pill { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 1px; background: var(--fill-2); color: var(--secondary); white-space: nowrap; }
.pill.orange { background: color-mix(in srgb, #ff9f0a 18%, transparent); color: #c66b00; }
.pill.green { background: color-mix(in srgb, #34c759 18%, transparent); color: #248a3d; }
.pill.red { background: color-mix(in srgb, #ff453a 16%, transparent); color: #d63a30; }
.pill.blue { background: color-mix(in srgb, #0a84ff 16%, transparent); color: #0a6fd8; }
@media (prefers-color-scheme: dark) {
  .pill.orange { color: #ffb340; } .pill.green { color: #4cd964; } .pill.red { color: #ff7a72; } .pill.blue { color: #5eb1ff; }
}
.ver-arrow { color: var(--tertiary); margin: 0 4px; }
.ver-new { color: var(--label); font-weight: 500; }
.sizebar { width: 120px; flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 12px; color: var(--secondary); font-variant-numeric: tabular-nums; }
.sizebar .bar { width: 100%; height: 5px; margin: 0; }
.hint { color: var(--secondary); font-size: 12px; margin: -2px 2px 8px; line-height: 1.45; }

/* timeline */
.tl { position: relative; margin-top: 8px; }
.tl::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; border-radius: 1px; background: var(--sep); }
.tl-item { position: relative; padding: 0 0 18px 30px; }
.tl-dot { position: absolute; left: 1px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--content); border: 3px solid var(--tertiary); }
.tl-item.changed .tl-dot { border-color: var(--accent); }
.tl-item.first .tl-dot { border-color: #34c759; }
.tl-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
.tl-head b { font-weight: 600; }
.tl-head .muted { color: var(--secondary); font-size: 12px; }
.tl-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.tl-chips .pill { margin: 0; }
.tl-item details { margin-top: 8px; }
.tl-item summary { cursor: default; color: var(--accent); font-size: 12px; width: max-content; }
.tl-detail { margin-top: 8px; background: var(--group); border: 1px solid var(--group-border); border-radius: 10px; padding: 4px 14px 10px; }
.tl-cat { font-size: 12px; font-weight: 600; margin: 10px 0 4px; display: flex; align-items: center; gap: 6px; }
.tl-cat svg { width: 13px; height: 13px; color: var(--secondary); }
.tl-line { font-size: 12.5px; display: flex; gap: 8px; padding: 2px 0; user-select: text; }
.tl-line .sym { width: 12px; flex: 0 0 auto; font-weight: 700; text-align: center; }
.tl-line.add .sym { color: #34c759; } .tl-line.rem .sym { color: #ff453a; } .tl-line.upd .sym { color: var(--accent); }
.tl-line .v { color: var(--secondary); font-variant-numeric: tabular-nums; }
/* notes */
.rnote { color: var(--secondary); font-size: 12px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; }
.act.has-note { color: #ff9f0a; opacity: 1; }
.row:has(.act.has-note) .ractions, .tilecard:has(.act.has-note) .ractions { opacity: 1; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.nav-item:focus-visible { outline-offset: -2px; }
.drop-hint { position: fixed; inset: 8px; z-index: 80; border: 2.5px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--accent) 10%, transparent); display: none; place-items: center; pointer-events: none; }
.drop-hint div { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--accent); font-size: 15px; }
.drop-hint svg { width: 44px; height: 44px; stroke-width: 1.6; }
body.dropping .drop-hint { display: grid; }
.sheet-bg { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.28); display: grid; place-items: start center; padding-top: 12vh; animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: min(460px, calc(100vw - 32px)); background: var(--content); border: 1px solid var(--group-border); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head .ricon, .sheet-head .ricon img { width: 36px; height: 36px; }
.sheet-head b { font-size: 15px; display: block; }
.sheet-head span { color: var(--secondary); font-size: 12px; }
.sheet textarea { width: 100%; min-height: 96px; resize: vertical; border-radius: 8px; border: 1px solid var(--group-border); background: var(--group); color: var(--label); font: 13px/1.45 -apple-system, sans-serif; padding: 8px 10px; outline: 0; user-select: text; }
.sheet textarea:focus, .sheet input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.sheet .lbl { font-size: 12px; font-weight: 600; color: var(--secondary); }
.tagpick { display: flex; flex-wrap: wrap; gap: 6px; }
.tagpick button { height: 24px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--group-border); background: var(--group); font-size: 12px; }
.tagpick button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tagpick input { height: 24px; width: 130px; border-radius: 12px; border: 1px solid var(--group-border); background: var(--group); color: var(--label); padding: 0 10px; font: 12px -apple-system, sans-serif; outline: 0; user-select: text; }
.palette { width: min(600px, calc(100vw - 32px)); padding: 0; gap: 0; overflow: hidden; }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--group-border); }
.pal-in svg { width: 18px; height: 18px; color: var(--secondary); flex: 0 0 auto; }
.pal-in input { flex: 1; border: 0; outline: 0; background: none; color: var(--label); font: 17px -apple-system, sans-serif; }
.pal-list { max-height: min(420px, 55vh); overflow-y: auto; padding: 6px; }
.pal-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; cursor: default; }
.pal-row .ricon, .pal-row .ricon img { width: 24px; height: 24px; }
.pal-row .ricon.glyph svg { width: 14px; height: 14px; }
.pal-row.on { background: var(--accent); color: #fff; }
.pal-row.on .rsub, .pal-row.on .pal-kind { color: rgba(255,255,255,.8); }
.pal-row .rmain { flex: 1; min-width: 0; }
.pal-row .rname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-kind { font-size: 11.5px; color: var(--secondary); white-space: nowrap; }
.pal-empty { padding: 22px; text-align: center; color: var(--secondary); }
.pal-foot { display: flex; gap: 16px; padding: 8px 16px; border-top: 1px solid var(--group-border); font-size: 11.5px; color: var(--secondary); }
kbd { font: 11px -apple-system, sans-serif; border: 1px solid var(--group-border); border-radius: 4px; padding: 0 4px; margin-right: 2px; background: var(--group); }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.sheet-foot .btn.danger { margin-right: auto; color: #ff453a; }
.noresults { text-align: center; color: var(--secondary); padding: 60px 20px; }
.noresults b { color: var(--label); display: block; font-size: 15px; margin-bottom: 4px; }

.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; background: color-mix(in srgb, var(--content) 88%, transparent); backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--group-border); box-shadow: var(--shadow); border-radius: 10px; padding: 8px 14px; font-size: 12.5px; max-width: min(560px, 90vw); transition: all .2s ease; z-index: 50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast code { font: 11.5px var(--mono); }
.scrim { display: none; }

/* ── Responsive ───────────────────────────────────────── */
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 30; transform: translateX(-100%); transition: transform .22s ease; background: var(--content); box-shadow: var(--shadow); }
  body:not(.browser) .sidebar { background: color-mix(in srgb, var(--content) 92%, transparent); backdrop-filter: blur(30px) saturate(180%); }
  body.browser .sidebar { background: var(--content); }
  body.sb-open .sidebar { transform: none; }
  body.sb-open .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.25); }
  .only-narrow { display: inline-flex; }
  .toolbar { padding-left: 84px; }
  .row .rcmd, .row .sizebar { display: none; }
  .page { padding: 18px 16px 40px; }
  .segmented { display: none; }
}
@media (max-width: 560px) {
  .hero img { width: 160px; height: 160px; }
  .tb-btn .tl { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-drag"></div>
    <div class="sb-search" id="sbSearch">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="Suchen" spellcheck="false" autocomplete="off">
      <button class="clear" id="qClear" aria-label="Suche löschen">✕</button>
    </div>
    <nav id="nav"></nav>
    <div class="sb-bottom"><div class="sb-foot" id="sbFoot"></div>
      <button class="sb-gear" id="gearBtn" data-nav="settings" aria-label="Einstellungen"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg></button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <section class="main">
    <header class="toolbar">
      <button class="tb-btn only-narrow" id="sbToggle" title="Seitenleiste"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button>
      <div class="titles"><h1 id="title">MacAtlas</h1><div class="subtitle" id="subtitle"></div></div>
      <div class="spacer"></div>
      <span class="snap-pill" id="snapPill"><span id="snapText">Snapshot</span><button id="snapBack">Eigener Mac</button></span>
      <div class="segmented" id="viewSeg" title="Darstellung">
        <button data-v="list" title="Liste"><svg class="i" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r=".6" fill="currentColor"/><circle cx="4.5" cy="12" r=".6" fill="currentColor"/><circle cx="4.5" cy="17.5" r=".6" fill="currentColor"/></svg></button>
        <button data-v="grid" title="Symbole"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg></button>
      </div>
      <button class="tb-btn" id="scanBtn" title="Mac neu scannen (⌘R)"><svg class="i" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4v4.5H15"/></svg></button>
      <button class="tb-btn" id="importBtn" title="Snapshot importieren (⌘I)"><svg class="i" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5"/><path d="M5 14.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3.5"/></svg></button>
      <button class="tb-btn" id="exportBtn" title="Exportieren (⌘E)"><svg class="i" viewBox="0 0 24 24"><path d="M12 14.5V3.5M7.5 8L12 3.5 16.5 8"/><path d="M8.5 10.5H7a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5.5a2 2 0 0 0-2-2h-1.5"/></svg></button>
    </header>
    <div class="content" id="content"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="drop-hint" aria-hidden="true"><div><svg class="i" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5"/><path d="M5 14.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3.5"/></svg><b id="dropText">Snapshot öffnen</b></div></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
