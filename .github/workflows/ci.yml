name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test-js:
    name: JavaScript tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check
        working-directory: electron
        run: |
          for f in main.js preload.js lib/core.js renderer/app.js renderer/i18n.js; do node --check "$f"; done
      - name: Unit & static tests
        working-directory: electron
        run: npm test
      - name: Shell scripts
        run: |
          bash -n build.sh electron/scripts/scan.sh
          shellcheck --severity=error build.sh electron/scripts/scan.sh "electron/dmg/Erste Hilfe wenn Mac es blockiert.command"

  test-python:
    name: Python tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app runs the builder with the system Python that ships with macOS (3.9)
          - name: macOS system Python
            os: macos-15
            python: /usr/bin/python3
          - name: Python 3.12
            os: ubuntu-latest
            python: python3
            setup: "3.12"
    steps:
      - uses: actions/checkout@v7
      - if: matrix.setup
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.setup }}
      - run: ${{ matrix.python }} --version
      - run: ${{ matrix.python }} -m unittest discover -s tests -v

  build-dmg:
    name: Build DMG
    needs: [lint-and-test-js, test-python]
    runs-on: macos-15   # Apple Silicon runner, matches the arm64 build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install dependencies
        working-directory: electron
        run: npm ci --no-audit --no-fund
      - name: Build (ad-hoc signed)
        run: ./build.sh --no-install
      - name: Verify app signature
        run: codesign --verify --deep --strict "electron/dist/MacAtlas-darwin-arm64/MacAtlas.app"
      - uses: actions/upload-artifact@v7
        with:
          name: MacAtlas-dmg
          path: build/MacAtlas.dmg
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-dmg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: MacAtlas-dmg
      - name: Create release with DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" MacAtlas.dmg \
            --repo "$GITHUB_REPOSITORY" --title "MacAtlas ${GITHUB_REF_NAME#v}" --generate-notes
