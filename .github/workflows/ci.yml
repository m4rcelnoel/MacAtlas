name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test-js:
    name: JavaScript tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check
        working-directory: electron
        run: |
          for f in main.js preload.js lib/core.js renderer/app.js renderer/i18n.js; do node --check "$f"; done
      - name: Unit & static tests
        working-directory: electron
        run: npm test
      - name: Shell scripts
        run: |
          bash -n build.sh electron/scripts/scan.sh
          shellcheck --severity=error build.sh electron/scripts/scan.sh "electron/dmg/Erste Hilfe wenn Mac es blockiert.command"

  test-python:
    name: Python tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app runs the builder with the system Python that ships with macOS (3.9)
          - name: macOS system Python
            os: macos-15
            python: /usr/bin/python3
          - name: Python 3.12
            os: ubuntu-latest
            python: python3
            setup: "3.12"
    steps:
      - uses: actions/checkout@v7
      - if: matrix.setup
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.setup }}
      - run: ${{ matrix.python }} --version
      - run: ${{ matrix.python }} -m unittest discover -s tests -v

  build-dmg:
    name: Build DMG
    needs: [lint-and-test-js, test-python]
    runs-on: macos-15   # Apple Silicon runner, matches the arm64 build
    env:
      # Secrets can't be used in step conditions directly; expose whether they exist
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install dependencies
        working-directory: electron
        run: npm ci --no-audit --no-fund
      # Developer ID signing + notarization when the repository secrets are set,
      # otherwise an ad-hoc signed build (see README → Notarization)
      - name: Import Developer ID certificate
        id: cert
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.HAS_CERT == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
      - name: Prepare notarization key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        if: env.HAS_NOTARY == 'true' && steps.cert.outputs.identity != ''
        run: printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
      - name: Build
        env:
          MACATLAS_SIGN_ID: ${{ steps.cert.outputs.identity }}
          MACATLAS_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          MACATLAS_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          [ -f "$RUNNER_TEMP/notary.p8" ] && export MACATLAS_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          ./build.sh --no-install
      - name: Verify signature
        run: |
          codesign --verify --deep --strict "electron/dist/MacAtlas-darwin-arm64/MacAtlas.app"
          if [ "$HAS_CERT" = "true" ] && [ "$HAS_NOTARY" = "true" ]; then
            # Signing secrets are configured, so anything but a notarized build is an error
            spctl --assess --type execute -vv "electron/dist/MacAtlas-darwin-arm64/MacAtlas.app"
            xcrun stapler validate build/MacAtlas.dmg
          else
            spctl --assess --type execute -vv "electron/dist/MacAtlas-darwin-arm64/MacAtlas.app" || echo "Not notarized (ad-hoc build)"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: MacAtlas-dmg
          path: build/MacAtlas.dmg
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-dmg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: MacAtlas-dmg
      - name: Create release with DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" MacAtlas.dmg \
            --repo "$GITHUB_REPOSITORY" --title "MacAtlas ${GITHUB_REF_NAME#v}" --generate-notes
